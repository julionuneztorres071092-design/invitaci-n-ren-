<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>Reel · Fiesta REN 2026</title>
<!-- Reel de 15 s (1080x1920, 30 fps). Toda la animación es función del tiempo: seek(t) dibuja el cuadro t.
     Abrir con ?play para verlo en tiempo real. render.js captura los cuadros y ffmpeg los une con audio.wav. -->
<style>

:root{--blue:#0f4984;--blue2:#2675b7;--red:#e81d37;--gold:#e4c16e;--gold2:#c9a25e;--black:#05070c;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--black);font-family:"Inter",sans-serif;font-weight:900;text-transform:uppercase;color:#fff;transform-origin:0 0}
.sc{position:absolute;inset:0;overflow:hidden}
.in{position:absolute;inset:0}
.row{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap;line-height:1}
.t{display:inline-block;white-space:nowrap;line-height:1;letter-spacing:-.02em;will-change:transform}
.ch{display:inline-block;white-space:pre}
.abs{position:absolute}
.serif{font-family:"Instrument Serif",serif;font-weight:400;text-transform:none;letter-spacing:0}
.caps{font-weight:700;font-size:44px;letter-spacing:.42em}
#fx{position:absolute;inset:0;width:1080px;height:1920px;pointer-events:none}
#s1{background:radial-gradient(120% 70% at 50% 40%,#1a63b0 0%,#0f4984 45%,#082a52 100%)}
#s2{background:var(--black)}
#s3{background:linear-gradient(180deg,#f02a44,#d3142c)}
#s4{background:#fff}
#s5{background:radial-gradient(90% 60% at 50% 50%,#0d2244 0%,#05070c 70%)}
#s6{background:radial-gradient(90% 60% at 50% 42%,#ffffff 0%,#f4f1ea 100%)}
.tile{position:absolute;left:60px;width:960px;border-radius:44px;padding:54px 60px;overflow:hidden;box-shadow:0 30px 60px -24px rgba(5,7,12,.45)}
.tile .caps{display:block;font-size:36px;margin-bottom:26px}
.tile .t{letter-spacing:-.03em}
svg{display:block;overflow:visible}
svg *{transform-box:fill-box;transform-origin:center}
</style>
</head>
<body>

const $=s=>document.querySelector(s);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const E={lin:t=>t,out:t=>1-Math.pow(1-t,4),out2:t=>1-(1-t)*(1-t),in:t=>t*t*t,io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  back:t=>{const c=2.4;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
  spring:t=>1-Math.cos(t*Math.PI*3.2)*Math.exp(-t*6)};
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- Motor de interpolación ---------- */
const anims=[],hooks=[];
const DEF={x:0,y:0,s:1,sx:1,sy:1,r:0,o:1,b:0};
function A(el,keys){ // keys: [t,{props},ease]
  const ks=[];let cur=Object.assign({},DEF);
  keys.forEach(k=>{cur=Object.assign({},cur,k[1]);ks.push({t:k[0],p:cur,e:E[k[2]||'out']})});
  anims.push({el,ks});return el;
}
function props(a,t){
  const ks=a.ks;if(t<=ks[0].t)return ks[0].p;if(t>=ks[ks.length-1].t)return ks[ks.length-1].p;
  let i=1;while(ks[i].t<t)i++;const k0=ks[i-1],k1=ks[i],u=k1.e((t-k0.t)/(k1.t-k0.t)),o={};
  for(const n in k1.p){const v0=k0.p[n]===undefined?k1.p[n]:k0.p[n];o[n]=v0+(k1.p[n]-v0)*u}
  return o;
}
function applyAll(t){
  for(const a of anims){const p=props(a,t),st=a.el.style;
    st.transform=`translate(${p.x.toFixed(2)}px,${p.y.toFixed(2)}px) rotate(${p.r.toFixed(3)}deg) scale(${(p.s*p.sx).toFixed(4)},${(p.s*p.sy).toFixed(4)})`;

    if(p.ls!==undefined)st.letterSpacing=p.ls.toFixed(3)+'em';
  }

}

/* ---------- Constructores ---------- */
function div(parent,cls,css,html){const d=document.createElement('div');if(cls)d.className=cls;if(css)d.style.cssText=css;if(html!==undefined)d.innerHTML=html;parent.appendChild(d);return d}

  A(t1,[[8.02,{x:-1200}],[8.32,{x:0},'back'],[9.5,{s:1}],[9.6,{s:1.035}],[9.8,{s:1},'out2']]);

  const dot=div(p,'abs','left:60px;top:230px;width:56px;height:56px;border-radius:50%;background:'+C.red);

{const w=$('#wipes');
  // 2 s: tres bandas diagonales
  [[C.gold,0],[C.red,.05],['#0f4984',.1]].forEach(([c,d],i)=>{const b=div(w,'abs',`left:-700px;top:-400px;width:2480px;height:2720px;background:${c}`);
    A(b,[[1.74+d,{x:-2700,r:-14}],[1.99,{x:0,r:-14},'out2'],[2.0+(.1-d),{x:0}],[2.3+(.1-d),{x:2700,r:-14},'in']])});
  // 4 s: círculo rojo que cubre
  const c4=div(w,'abs','left:-760px;top:-340px;width:2600px;height:2600px;border-radius:50%;background:'+C.red);
  A(c4,[[3.68,{s:0}],[3.995,{s:1},'in'],[4,{s:1,o:1}],[4.001,{o:0}]]);
  // 6 s: persianas rojas
  for(let i=0;i<8;i++){const b=div(w,'abs',`left:0;top:${i*240}px;width:1080px;height:241px;background:${i%2?'#d3142c':'#f02a44'}`);
    A(b,[[5.74+i*.014,{x:i%2?1100:-1100}],[5.985,{x:0},'out2'],[6,{o:1}],[6.001,{o:0}]])}
  // 8 s: círculo blanco desde el vinilo
  const c8=div(w,'abs','left:-760px;top:140px;width:2600px;height:2600px;border-radius:50%;background:#fff');
  A(c8,[[7.7,{s:0}],[7.995,{s:1.1},'in'],[8,{o:1}],[8.001,{o:0}]]);
  // 10 s: columnas negras
  for(let i=0;i<6;i++){const b=div(w,'abs',`left:${i*180}px;top:0;width:181px;height:1920px;background:${C.black};transform-origin:50% ${i%2?100:0}%`);
    A(b,[[9.72+i*.02,{sy:0}],[9.985,{sy:1},'io'],[10,{o:1}],[10.001,{o:0}]])}
  // 12 s: destello blanco
  const c12=div(w,'abs','left:-760px;top:-340px;width:2600px;height:2600px;border-radius:50%;background:#fff');
  A(c12,[[11.68,{s:0}],[11.995,{s:1},'in'],[12,{o:1}],[12.35,{o:0},'lin']]);
}

/* ---------- Lienzo: nieve, líneas de velocidad y destellos ---------- */
const g=$('#fx').getContext('2d');
const R=rng(20261212);
const flakes=[...Array(120)].map(()=>{const z=R();return{x:R()*W,y:R()*H,r:2+z*6,v:140+z*330,a:.35+z*.55,p:R()*6.28,s:.6+R()*1.4,d:20+R()*50}});
const streaks=[...Array(22)].map(()=>({y:R()*H,l:160+R()*520,v:2600+R()*3600,o:R()*4000,w:3+R()*7,c:R()}));
const rays=[...Array(70)].map(()=>({a:R()*6.283,v:.7+R()*1.6,o:R(),w:2+R()*5,c:R()}));
const bursts=[[10.0,300,520,1.2],[10.5,800,640,1.1],[11.0,540,430,1.5],[11.25,220,900,1],[11.5,860,980,1.2],[11.75,540,700,1.7],
              [1.5,540,960,1.3],[5.0,180,560,1],[5.5,900,1300,1.1]].map(([t,x,y,s],i)=>{const r=rng(900+i);
  return{t,x,y,s,p:[...Array(Math.round(64*s))].map(()=>({a:r()*6.283,v:(300+r()*900)*s,d:.7+r()*.7,w:3+r()*5,c:r()}))}});
const twinkles=[...Array(26)].map(()=>({x:60+R()*960,y:360+R()*760,p:R()*6.28,s:2+R()*3,z:8+R()*18}));
function star4(x,y,z,rot){g.save();g.translate(x,y);g.rotate(rot);g.beginPath();for(let i=0;i<8;i++){const rr=i%2?z*.22:z,a=i*Math.PI/4;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}g.closePath();g.fill();g.restore()}
function drawFX(t){
  g.clearRect(0,0,W,H);const light=(t>=8&&t<10)||t>=12;
  // líneas de velocidad (0–4 s)
  if(t<4.1){g.lineCap='round';for(const s of streaks){const x=((s.o+t*s.v)%(W+1400))-700,al=(t<2?.5:.32);
    g.strokeStyle=s.c<.4?`rgba(228,193,110,${al})`:(s.c<.7?`rgba(232,29,55,${al})`:`rgba(255,255,255,${al*.8})`);g.lineWidth=s.w;g.beginPath();g.moveTo(x,s.y);g.lineTo(x+s.l,s.y);g.stroke()}}
  // rayos radiales (10–12 s)
  if(t>=10&&t<12.05){const acc=1+clamp((t-11)/1)*2.2;g.lineCap='round';for(const r of rays){const k=((r.o+(t-10)*r.v*acc*.9)%1),d0=120+k*k*1500,d1=d0+60+k*380;
    g.strokeStyle=r.c<.5?`rgba(228,193,110,${.15+k*.6})`:(r.c<.75?`rgba(38,117,183,${.2+k*.6})`:`rgba(255,255,255,${.1+k*.5})`);g.lineWidth=r.w*(.4+k);
    g.beginPath();g.moveTo(540+Math.cos(r.a)*d0,960+Math.sin(r.a)*d0);g.lineTo(540+Math.cos(r.a)*d1,960+Math.sin(r.a)*d1);g.stroke()}}
  // destellos dorados tipo fuegos artificiales
  g.globalCompositeOperation='lighter';g.lineCap='round';
  for(const b of bursts){const u=t-b.t;if(u<0||u>1.5)continue;
    if(u<.3){const rr=220*b.s*(.3+u*3),gr=g.createRadialGradient(b.x,b.y,0,b.x,b.y,rr);gr.addColorStop(0,`rgba(255,240,200,${.8*(1-u/.3)})`);gr.addColorStop(1,'rgba(255,240,200,0)');g.fillStyle=gr;g.beginPath();g.arc(b.x,b.y,rr,0,6.283);g.fill()}
    for(const q of b.p){const k=u/q.d;if(k>=1)continue;const f=(1-Math.exp(-3.2*u))/3.2,f0=(1-Math.exp(-3.2*Math.max(0,u-.05)))/3.2;
      const x=b.x+Math.cos(q.a)*q.v*f,y=b.y+Math.sin(q.a)*q.v*f+260*u*u,x0=b.x+Math.cos(q.a)*q.v*f0,y0=b.y+Math.sin(q.a)*q.v*f0+260*Math.max(0,u-.05)**2;
      const al=(1-k)*(1-k)*(.7+.3*Math.sin(q.a*9+u*40));g.strokeStyle=q.c<.6?`rgba(240,205,120,${al})`:(q.c<.85?`rgba(255,245,215,${al})`:`rgba(232,29,55,${al})`);g.lineWidth=q.w*(1-k*.5);
      g.beginPath();g.moveTo(x0,y0);g.lineTo(x,y);g.stroke()}}
  g.globalCompositeOperation='source-over';
  // destellos alrededor del logo (final)
  if(t>=12.3){g.fillStyle=C.gold2;for(const w of twinkles){const a=Math.max(0,Math.sin(w.p+t*w.s))*clamp((t-12.3)/.5);if(a<.05)continue;g.globalAlpha=a*.9;star4(w.x,w.y,w.z*a,t*.6+w.p)}g.globalAlpha=1}
  // nieve
  for(const f of flakes){const y=(f.y+f.v*t)%(H+40)-20,x=((f.x+Math.sin(f.p+t*f.s)*f.d+t*26)%(W+40)+W+40)%(W+40)-20;
    g.globalAlpha=f.a*(light?.5:1);g.fillStyle=light?C.blue2:'#fff';g.beginPath();g.arc(x,y,f.r,0,6.283);g.fill()}
  g.globalAlpha=1;
}

/* ---------- Bucle ---------- */
const CUTS=[0,2,4,6,8,10,12,15.01];
function seek(t){
  t=clamp(t,0,DUR);
  for(let i=0;i<7;i++)$('#s'+i).style.display=(t>=CUTS[i]&&t<CUTS[i+1])?'block':'none';
  applyAll(t);drawFX(t);
}
window.seek=seek;
(async()=>{
  const svgText=await (await fetch('../assets/img/ren-logo-vector.svg')).text();
  buildFinale(svgText);
  await document.fonts.load('900 100px Inter');await document.fonts.load('italic 100px "Instrument Serif"');await document.fonts.load('100px "Instrument Serif"');await document.fonts.ready;
  // ajuste de ancho: todas las escenas visibles para medir
  document.querySelectorAll('.sc').forEach(s=>s.style.display='block');
  for(const [el,w] of fits){el.style.fontSize='100px';const r=el.getBoundingClientRect().width;el.style.fontSize=(100*w/r).toFixed(2)+'px'}
  seek(0);window.ready=true;
  if(location.search.includes('play')){
    const k=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform=`scale(${k})`;
    const au=new Audio('audio.wav');let t0=null;
    const go=()=>{t0=performance.now();au.currentTime=0;au.play().catch(()=>{});requestAnimationFrame(function f(n){const t=(n-t0)/1000;seek(Math.min(t,DUR));if(t<DUR)requestAnimationFrame(f)})};
    addEventListener('click',go);go();
  }
})();
</script>
