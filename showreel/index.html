<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>REN Showreel</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;max-height:100vh}</style></head>
<body><canvas id="acc" width="1920" height="1080"></canvas>
<script>
const W=1920,H=1080,DUR=15;
const BLUE='#1244C8',NAVY='#0A2A7A',RED='#E4202D',WHITE='#FFFFFF',GRAY='#5d6b7c';
const cl=x=>Math.min(1,Math.max(0,x));
const oc=x=>1-Math.pow(1-x,3);
const oe=x=>x>=1?1:1-Math.pow(2,-10*x);
const ob=x=>{const c1=2.0,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const pr=(t,a,d)=>cl((t-a)/d);
const rnd=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};

const work=document.createElement('canvas');work.width=W;work.height=H;
const wc=work.getContext('2d');
const acc=document.getElementById('acc');const ac=acc.getContext('2d');

function T(c,s,x,y,size,o={}){
  c.font=`${o.italic?'italic ':''}${o.weight||900} ${size}px Inter, sans-serif`;
  c.textBaseline='alphabetic';c.textAlign='center';
  const ls=o.ls||0,chars=[...s];
  const ws=chars.map(ch=>c.measureText(ch).width+ls);
  const total=ws.reduce((a,b)=>a+b,0)-ls;
  let cx=o.align==='center'?x-total/2:o.align==='right'?x-total:x;
  chars.forEach((ch,i)=>{
    const f=o.per?o.per(i,chars.length):{};
    const a=f.a===undefined?1:f.a;
    if(a<=0){cx+=ws[i];return}
    c.save();c.globalAlpha*=a;
    if(o.mask){c.beginPath();c.rect(cx-size*.2,y-size*.98,ws[i]+size*.4,size*1.2);c.clip()}
    c.translate(cx+(ws[i]-ls)/2+(f.dx||0),y+(f.dy||0));
    if(f.rot)c.rotate(f.rot);
    c.scale(f.sx===undefined?1:f.sx,f.sy===undefined?1:f.sy);
    if(o.fill){c.fillStyle=o.fill;c.fillText(ch,0,0)}
    if(o.stroke){c.strokeStyle=o.stroke;c.lineWidth=o.lw||3;c.lineJoin='round';c.strokeText(ch,0,0)}
    c.restore();cx+=ws[i];
  });
  return total;
}
function measure(c,s,size,o={}){c.font=`${o.italic?'italic ':''}${o.weight||900} ${size}px Inter, sans-serif`;return c.measureText(s).width+(o.ls||0)*(s.length-1)}

/* ---------- LOGO (rehecho en vectores) ---------- */
const LOGO={
  stripes:[[10,50,0,'r'],[70,150,0,'b'],[30,70,1,'r'],[90,150,1,'b'],[40,150,2,'b'],[60,150,3,'b'],[40,150,4,'b'],[80,150,5,'b'],[100,150,6,'b']],
  R:new Path2D('M150 40H250C285 40 305 62 305 92C305 118 290 135 268 142L312 200H250L212 146H205V200H150Z M205 82V104H245C255 104 260 98 260 93C260 88 255 82 245 82Z'),
  E:new Path2D('M335 40H420V66H365V106H410V132H365V174H420V200H335Z'),
  N:new Path2D('M445 200V40H475L520 140V40H550V200H520L475 100V200Z')
};
function drawLogo(c,cx,cy,s,t,colors){
  const bl=colors&&colors.blue||BLUE,rd=colors&&colors.red||RED,tx=colors&&colors.text||GRAY;
  c.save();c.translate(cx-280*s,cy-145*s);c.scale(s,s);
  LOGO.stripes.forEach(([x0,x1,row,col],i)=>{
    const p=pr(t,0.04*row+(col==='r'?0.05:0),0.55);if(p<=0)return;
    c.save();c.globalAlpha=cl(p*2);
    c.translate(-(1-oe(p))*900,0);
    c.fillStyle=col==='r'?rd:bl;
    c.fillRect(x0,40+row*24,x1-x0,16);c.restore();
  });
  [['R',0],['E',1],['N',2]].forEach(([k,i])=>{
    const p=pr(t,.38+i*.12,.6);if(p<=0)return;
    c.save();c.globalAlpha=cl(p*3);
    c.translate(0,200);c.scale(1,Math.max(.001,ob(p)));c.translate(0,-200);
    c.fillStyle=bl;c.fill(LOGO[k],'evenodd');c.restore();
  });
  const p=pr(t,1.0,.7);
  if(p>0){c.save();c.globalAlpha=cl(p*2);
    const ls=10+60*(1-oe(p));
    T(c,'TRANSPORTES',350,262,46,{weight:600,fill:tx,ls,align:'center'});
    c.restore();}
  c.restore();
}

/* ---------- ESCENAS ---------- */
function streaks(c,lt,n,cols,alpha,speed,thick){
  for(let i=0;i<n;i++){
    const len=300+rnd(i)*700,sp=speed*(0.6+rnd(i+9)*1.2),y=40+(i/n)*(H-80)+rnd(i+3)*20;
    const x=W-((lt*sp+rnd(i+5)*(W+len))%(W+len));
    c.globalAlpha=alpha;c.fillStyle=cols[i%cols.length];c.fillRect(x,y,len,thick);
  }
  c.globalAlpha=1;
}
function S1(c,lt){
  c.fillStyle=WHITE;c.fillRect(0,0,W,H);
  streaks(c,lt,16,[BLUE,RED,BLUE],0.9-0.72*pr(lt,.2,.8),3400,7);
  const per=(i,n)=>{const p=pr(lt,.18+i*.07,.55);return{a:p>0?1:0,dy:(1-ob(p))*520,rot:(1-oe(p))*-.25}};
  T(c,'MUEVE',W/2,560,340,{italic:1,fill:BLUE,align:'center',per,mask:false});
  const p2=pr(lt,.85,.45);
  c.save();c.fillStyle=RED;const bw=1100*oe(p2);c.transform(1,0,-.2,1,0,0);
  c.fillRect((W/2+200)-bw/2-0,640,bw,170);c.restore();
  c.save();c.globalAlpha=p2>0?1:0;
  T(c,'EL MUNDO',W/2,775,130,{italic:1,fill:WHITE,align:'center',ls:6,
    per:(i)=>{const p=pr(lt,.95+i*.04,.4);return{a:p,dx:(1-oe(p))*-120}}});
  c.restore();
  T(c,'TRANSPORTES REN',90,95,28,{weight:700,fill:NAVY,ls:8,per:()=>({a:oe(pr(lt,.3,.5))})});
  T(c,'01 / 05',W-90,95,28,{weight:700,fill:RED,ls:6,align:'right'});
  c.fillStyle=NAVY;c.fillRect(90,H-80,(W-180)*oe(pr(lt,0,1.2)),4);
}
function S2(c,lt){
  c.fillStyle=BLUE;c.fillRect(0,0,W,H);
  c.strokeStyle=WHITE;
  for(let i=0;i<14;i++)for(let j=0;j<8;j++){
    const a=.22*pr(lt,.05+(i+j)*.02,.4);c.globalAlpha=a;
    const x=70+i*140,y=80+j*130;c.fillStyle=WHITE;c.fillRect(x-14,y-1.5,28,3);c.fillRect(x-1.5,y-14,3,28);
  }
  c.globalAlpha=1;
  const cx=1390,cy=540;
  for(let k=0;k<5;k++){
    const r=150+k*78,rot=lt*(k%2?-1.4:1.1)+k;
    c.save();c.globalAlpha=.75*oe(pr(lt,.05+k*.07,.5));c.lineWidth=k===2?10:4;
    c.beginPath();c.arc(cx,cy,r*oe(pr(lt,.05+k*.07,.6)),rot,rot+Math.PI*(.7+k*.16));c.stroke();c.restore();
    const d=lt*(k%2?-1.4:1.1)+k;
    c.fillStyle=k%2?RED:WHITE;c.beginPath();c.arc(cx+Math.cos(d+3)*r,cy+Math.sin(d+3)*r,10,0,7);c.fill();
  }
  c.fillStyle=RED;c.beginPath();c.arc(cx,cy,130*ob(pr(lt,.1,.7)),0,7);c.fill();
  T(c,'REN',cx,cy+36,110,{italic:1,fill:WHITE,align:'center',per:()=>({a:pr(lt,.5,.3)})});
  T(c,'PRECISIÓN',90,520,200,{italic:1,fill:WHITE,mask:true,per:(i)=>{const p=pr(lt,.1+i*.055,.6);return{dy:(1-oe(p))*260}}});
  const p3=pr(lt,.7,.7);
  T(c,'EN CADA RUTA',96,665,100,{italic:1,stroke:WHITE,lw:3,ls:4,per:(i)=>({a:cl(pr(lt,.7+i*.03,.3)),dx:(1-oe(pr(lt,.7+i*.03,.5)))*-200})});
  c.fillStyle=RED;c.fillRect(96,715,820*oe(p3),14);
  T(c,'02 / 05',96,95,28,{weight:700,fill:WHITE,ls:6});
}
function S3(c,lt){
  c.fillStyle=RED;c.fillRect(0,0,W,H);
  const word='VELOCIDAD  ',w=measure(c,word,230,{italic:1});
  for(let i=0;i<5;i++){
    const dir=i%2?1:-1,off=((lt*(520+i*140)*dir)%w+w)%w;
    c.save();c.globalAlpha=i===2?1:.9;
    const y=135+i*205;
    for(let k=-1;k<Math.ceil(W/w)+1;k++){
      if(i===2)T(c,word,k*w-off,y,230,{italic:1,fill:'rgba(255,255,255,.18)'});
      T(c,word,k*w-off,y,230,{italic:1,stroke:WHITE,lw:3.5});
    }
    c.restore();
  }
  const p=pr(lt,.3,.6),s=ob(p);
  c.save();c.translate(W/2,H/2);c.scale(s,s);c.transform(1,0,-.2,1,0,0);
  c.fillStyle=BLUE;c.fillRect(-640,-170,1280,340);
  c.fillStyle=WHITE;c.fillRect(-640,170,1280,14);
  c.transform(1,0,.2,1,0,0);
  T(c,'100% A TIEMPO',0,50,140,{italic:1,fill:WHITE,align:'center',per:(i)=>({a:pr(lt,.45+i*.03,.3),dy:(1-oe(pr(lt,.45+i*.03,.4)))*80})});
  T(c,'LLEGAMOS CUANDO DECIMOS',0,125,40,{weight:700,fill:'#BFD0FF',align:'center',ls:8,per:()=>({a:pr(lt,1.0,.4)})});
  c.restore();
  T(c,'03 / 05',90,H-60,28,{weight:700,fill:WHITE,ls:6});
}
function S4(c,lt){
  c.fillStyle=WHITE;c.fillRect(0,0,W,H);
  const cols=16,rows=9,cs=120;
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){
    const d=Math.hypot(i-cols/2,j-rows/2);
    const pop=ob(pr(lt,d*.045,.5));
    const wave=.55+.45*Math.sin(lt*6-d*.9);
    const s=cs*.78*pop*wave;if(s<=0)continue;
    const red=(i*7+j*3)%11===0;
    c.save();c.translate(i*cs+cs/2,j*cs+cs/2);c.rotate((1-pop)*1.2+Math.sin(lt*3+i)*.08*wave);
    c.fillStyle=red?RED:BLUE;c.globalAlpha=red?1:.9;c.fillRect(-s/2,-s/2,s,s);c.restore();
  }
  const p=pr(lt,.35,.55);
  c.save();c.translate(W/2,H/2);c.scale(ob(p),ob(p));
  c.fillStyle=WHITE;c.fillRect(-780,-190,1560,380);
  c.fillStyle=RED;c.fillRect(-780,190,1560*oe(pr(lt,.7,.6)),16);
  c.strokeStyle=NAVY;c.lineWidth=8;c.strokeRect(-780,-190,1560,380);
  T(c,'SIN LÍMITES',0,75,210,{italic:1,fill:BLUE,align:'center',
    per:(i)=>{const q=pr(lt,.5+i*.05,.5);return{sy:Math.max(.001,Math.abs(Math.cos((1-oe(q))*Math.PI/2*3))*(q>0?1:0)),a:q>0?1:0}}});
  c.restore();
  T(c,'04 / 05',90,H-60,28,{weight:700,fill:WHITE,ls:6});
}
function S5(c,lt){
  const seg=1.6/3,idx=Math.min(2,Math.floor(lt/seg)),ll=lt-idx*seg;
  const bgs=[BLUE,WHITE,RED],fgs=[WHITE,RED,WHITE],sh=[RED,BLUE,NAVY],words=['RÁPIDO','SEGURO','CONFIABLE'];
  c.fillStyle=bgs[idx];c.fillRect(0,0,W,H);
  streaks(c,lt+idx*3,18,[fgs[idx]],.22,5200,5);
  let size=420;const mw=measure(c,words[idx],size,{italic:1});size*=Math.min(1,1650/mw);
  const p=oe(pr(ll,0,.16)),sc=1+.35*(1-p),shake=(1-p)*14*Math.sin(ll*90);
  c.save();c.translate(W/2+shake,H/2+size*.33);c.scale(sc,sc);
  T(c,words[idx],14,14,size,{italic:1,fill:sh[idx],align:'center'});
  T(c,words[idx],0,0,size,{italic:1,fill:fgs[idx],align:'center'});
  c.restore();
  for(let i=0;i<3;i++){
    c.fillStyle=fgs[idx];c.globalAlpha=.35;c.fillRect(90+i*620,H-70,560,8);
    c.globalAlpha=1;c.fillRect(90+i*620,H-70,560*(i<idx?1:i===idx?pr(ll,0,seg):0),8);
  }
}
function S6(c,lt){
  c.fillStyle=WHITE;c.fillRect(0,0,W,H);
  for(let k=0;k<4;k++){
    const r=260+k*150+Math.sin(lt*2+k)*14;
    c.strokeStyle=k%2?RED:BLUE;c.globalAlpha=.07*oe(pr(lt,k*.1,.8));c.lineWidth=3;
    c.beginPath();c.arc(W/2,400,r,0,7);c.stroke();
  }
  c.globalAlpha=1;
  // barrido de luz
  const sw=pr(lt,1.6,.7);
  drawLogo(c,W/2,390,2.0,lt);
  if(sw>0&&sw<1){
    c.save();c.globalAlpha=.9;c.fillStyle=RED;const x=-300+(W+600)*io(sw);
    c.transform(1,0,-.35,1,0,0);c.fillRect(x-30+330,140,10,520);c.fillStyle=BLUE;c.fillRect(x+330,140,40,520);c.restore();
  }
  const p=pr(lt,1.5,.6),b=ob(p),pulse=1+.025*Math.sin(Math.max(0,lt-2.1)*7);
  c.save();c.translate(W/2,830);c.scale(b*pulse,b*pulse);
  c.fillStyle=RED;const bw=760,bh=130;
  c.beginPath();c.roundRect(-bw/2,-bh/2,bw,bh,65);c.fill();
  T(c,'COTIZA TU ENVÍO  →',0,26,58,{weight:800,fill:WHITE,align:'center',ls:3});
  c.restore();
  T(c,'MOVEMOS TU CARGA · IMPULSAMOS TU NEGOCIO',W/2,985,30,{weight:600,fill:NAVY,align:'center',ls:6,per:()=>({a:pr(lt,1.9,.5)})});
}

const STARTS=[0,2.6,5.2,7.8,10.4,12.0],SCENES=[S1,S2,S3,S4,S5,S6];
const ACCENT=[null,RED,WHITE,BLUE,RED,BLUE],TD=.55;
function draw(c,t){
  t=Math.min(Math.max(t,0),DUR-1/60);
  let i=0;for(let k=0;k<STARTS.length;k++)if(t>=STARTS[k])i=k;
  const lt=t-STARTS[i];
  if(i>0&&lt<TD){
    SCENES[i-1](c,t-STARTS[i-1]);
    const bands=9,bh=H/bands,SL=170;
    const mk=(extra)=>{const pth=new Path2D();
      for(let b=0;b<bands;b++){
        const order=(b%2?bands-b:b),p=io(pr(lt,order*.025,.34));
        const e=p*(W+SL+extra);if(p<=0)continue;
        const y0=b*bh,y1=y0+bh+1;
        pth.moveTo(0,y0);pth.lineTo(e,y0);pth.lineTo(e-SL,y1);pth.lineTo(0,y1);pth.closePath();
      }return pth};
    c.save();c.fillStyle=ACCENT[i];c.fill(mk(110));c.restore();
    c.save();c.clip(mk(0));SCENES[i](c,lt);c.restore();
  }else SCENES[i](c,lt);
}
window.renderFrame=function(t,N=4,shutter=.45){
  for(let k=0;k<N;k++){
    const tt=t+((k+.5)/N-.5)*shutter/30;
    wc.clearRect(0,0,W,H);draw(wc,tt);
    ac.globalAlpha=1/(k+1);ac.drawImage(work,0,0);
  }
  ac.globalAlpha=1;
  return acc.toDataURL('image/png').split(',')[1];
};
document.fonts.load('italic 900 100px Inter').then(()=>document.fonts.load('600 40px Inter')).then(()=>{window.ready=true;window.renderFrame(0,1)});
</script></body></html>
